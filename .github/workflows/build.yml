name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: sum.golang.org
  GONOSUMCHECK: 'github.com/bogdanfinn/*'

jobs:
  checks:
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache: false
      - run: go clean -modcache || true
      - run: go mod download -x
        working-directory: native
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib test integration_test test_driver
      - run: dart analyze lib test integration_test test_driver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native

  android:
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache: false
      - run: go clean -modcache || true
      - run: go mod download -x
        working-directory: native
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Add sdkmanager to PATH
        run: |
          SDKM_BIN=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path '*/bin/*' | head -1)")
          echo "$SDKM_BIN" >> "$GITHUB_PATH"
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
  windows:
    if: true
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install MinGW
        run: |
          $installed = $false
          for ($i = 0; $i -lt 5 -and -not $installed; $i++) {
            try {
              winget install -e --id MSYS2.MSYS2 --accept-source-agreements --accept-package-agreements 2>$null
              $installed = $true
            } catch {
              Write-Host "winget attempt $i failed, retrying in 15s..."
              Start-Sleep 15
            }
          }
          if (-not $installed) {
            for ($i = 0; $i -lt 5 -and -not $installed; $i++) {
              try {
                choco install mingw --version=13.2.0 -y --no-progress 2>$null
                $installed = $true
              } catch {
                Write-Host "choco attempt $i failed, retrying in 15s..."
                Start-Sleep 15
              }
            }
          }
          if (-not $installed) { throw "MinGW install failed after retries" }
          $paths = @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\msys64\mingw64\bin",
            "$env:LOCALAPPDATA\Microsoft\WinGet\Links"
          )
          foreach ($p in $paths) { if (Test-Path $p) { Add-Content $env:GITHUB_PATH $p } }
          $lib = "C:\ProgramData\mingw64\mingw64\x86_64-w64-mingw32\lib"
          if (Test-Path $lib) {
            Remove-Item (Join-Path $lib 'libpthread.dll.a') -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $lib 'libwinpthread.dll.a') -ErrorAction SilentlyContinue
          }
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - name: Install ffmpeg
        run: |
          $installed = $false
          for ($i = 0; $i -lt 5 -and -not $installed; $i++) {
            try {
              winget install -e --id Gyan.FFmpeg --accept-source-agreements --accept-package-agreements 2>$null
              $installed = $true
            } catch {
              Write-Host "winget ffmpeg attempt $i failed, retrying in 15s..."
              Start-Sleep 15
            }
          }
          if (-not $installed) {
            for ($i = 0; $i -lt 5 -and -not $installed; $i++) {
              try {
                choco install ffmpeg --no-progress -y 2>$null
                $installed = $true
              } catch {
                Write-Host "choco ffmpeg attempt $i failed, retrying in 15s..."
                Start-Sleep 15
              }
            }
          }
          if (-not $installed) { Write-Host "ffmpeg install skipped (non-fatal for smoke test)" }
      - name: Windows package smoke
        run: python scripts/smoke_windows.py ${{ matrix.arguments }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  ios:
    if: false
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache: false
      - run: go clean -modcache || true
      - run: go mod download -x
        working-directory: native
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14



  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect packages
        run: |
          find dist -type f \( -name '*.apk' -o -name '*-windows-x64.zip' \) -exec mv {} . \;
          ls -la *.apk *.zip
      - name: Generate SHA256
        run: sha256sum *.apk *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FILES=$(ls *.apk *.zip SHA256SUMS.txt 2>/dev/null)
          gh release create "$TAG" \
            --title "真果鉴 $TAG" \
            --notes-file .github/release-notes.md \
            $FILES \
            --latest
