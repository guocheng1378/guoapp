name: duanju_app
description: 独立运行的多端短剧应用
publish_to: none
version: 0.2.96+2246
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_foreground_task: 11.0.3
  ffmpeg_kit_flutter_new_min_gpl: 2.6.2
  file_picker: 13.1.0
  crypto: ^3.0.7
  cryptography: ^2.7.0
  window_manager: ^0.5.1
  nsd: 5.0.1
  flutter_svg: ^2.0.17
  url_launcher: ^6.3.0
  # 顶栏「渐变模糊」：真·可变半径高斯（fragment shader + ImageFilter.shader），
  # 模糊强度从指定边缘连续淡出到 0，tint wash 与模糊同一条 falloff。
  # 参照 MIUI 主题商店雾面带真值（σ20 起、底缘自然消失）自研雾面的底座。
  haze: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  url_launcher_platform_interface: ^2.3.2

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video
  # 2.5.0/2.5.1 均已迁移 Built-in Kotlin（无 kotlin-android 插件声明），本项目
  # android.builtInKotlin=false 时其 Kotlin 源不编译，app javac 找不到
  # SharedPreferencesPlugin（2135 成功是 intermediates 增量复用的假象）。
  # 约束 ^2.3.4 允许降到 Groovy 形态旧版。
  shared_preferences_android: 2.4.3

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/video_enhancement/
    - assets/icons/
    # 播放器专用图标：增量构建时目录通配可能不收录后加的文件，显式登记兜底
    - assets/icons/player-play.svg
    - assets/icons/player-pause.svg
    - assets/icons/player-lock.svg
    - assets/icons/player-lock-open.svg
    - assets/icons/player-cast.svg
    - assets/icons/player-cast-connected.svg
